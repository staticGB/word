<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Does Verb</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#eee;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace}
canvas{position:fixed;inset:0}
#ui{position:fixed;top:0;left:0;right:0;padding:16px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
input,textarea{width:min(300px,44vw);min-width:140px;font:700 22px ui-monospace,Menlo,Consolas,monospace;color:#eee;background:#111;border:2px solid #333;border-radius:8px;padding:10px 14px;outline:none}
input:focus,textarea:focus{border-color:#eee}
input::placeholder,textarea::placeholder{color:#666;font-weight:400}textarea{resize:none;height:76px;line-height:1.2}#ui{pointer-events:none}input,textarea{pointer-events:auto}canvas{touch-action:none}#ctl{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:100%;font-size:13px;color:#888;align-items:center}#ctl input{min-width:0;font-size:15px;padding:6px 10px}#ctl input[type=range]{width:120px;padding:0;border:0;background:none;accent-color:#eee;vertical-align:middle}#ctl #sy{width:170px}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">
<textarea id="w" placeholder="word" maxlength="200" autocomplete="off" spellcheck="false">word</textarea>
<input id="v" placeholder="verb" value="run" maxlength="30" autocomplete="off" spellcheck="false">
<div id="ctl"><label>speed <input id="sp" type="range" min="0" max="3" step=".05" value="1"></label><label>symbols <input id="am" type="range" min="0" max="3" step=".05" value="1"></label><input id="sy" placeholder="your own symbols" maxlength="20" autocomplete="off" spellcheck="false"></div>
</div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d'),wI=document.getElementById('w'),vI=document.getElementById('v');
let spd=1,amt=1,symG=null,W,H,DPR,fs,adv,gy,gnd,ww=0,BP=[],dd=[],drag=-1,chars=[],seeds=[],Lp=[],P=[],TS={},t=0,vf=null,vt='';
const R=(a,b)=>a+Math.random()*(b-a),pick=s=>{const a=typeof s=='string'?Array.from(s):s;return a[Math.floor(Math.random()*a.length)]};
const tk=(k,p)=>{if(t-(TS[k]??-9)>=p){TS[k]=t;return true}return false};
const F=()=>`bold ${fs}px ${FF}`;

const FF='ui-monospace,Menlo,Consolas,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",monospace';
let lines=[];
function lay(){
  DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  const L=Math.max(lines.length,1),sum=l=>l.reduce((a,c)=>a+c.w,0),mu=Math.max(1,...lines.map(sum));
  fs=Math.max(20,Math.min(170,W*.9/mu/.62,H*.4/(L*1.2)));adv=fs*.62;gy=H*.5;gnd=H*.9;ww=mu*adv;
  const lh=fs*1.2;BP=[];
  lines.forEach((l,k)=>{let x=W/2-sum(l)*adv/2;const y=gy+(k-(L-1)/2)*lh;
    l.forEach(c=>{if(c.g.trim())BP.push({x:x+c.w*adv/2,y});x+=c.w*adv})});
}
addEventListener('resize',lay);

/* spawn a particle from letter i (at its base; dy shifts it) */
function em0(i,g,vx,vy,o={}){
  const l=Lp[i]||{x:W/2,y:gy};
  P.push({x:l.x+(o.dx||0),y:l.y+(o.dy||0),vx,vy,gr:o.gr===undefined?700:o.gr,r:0,vr:R(-3,3),life:0,max:o.max||2,s:o.s||.4,c:o.c||'#bbb',land:!!o.land,g});
  if(P.length>600)P.shift();
}

const em=(i,g,vx,vy,o)=>{let c=Math.floor(amt)+(Math.random()<amt%1?1:0);while(c-->0)em0(i,symG?pick(symG):g,vx,vy,o)};
/* each verb: (letterIndex, count, time) -> how that letter moves. x,y px; r radians; sx,sy scale about the baseline */
const V={
shit:(i,n,t)=>{const c=(t+i*.25)%3,st=c<1.8,k=st?c/1.8:0;
  if(!st&&tk('s'+i,.45))em(i,pick('.,;:'),R(-12,12),R(0,40),{land:1,max:40,s:.45});
  return{x:st?Math.sin(t*50+i)*4*k:0,y:k*fs*.1,sx:1+.12*k,sy:1-.3*k,r:st?Math.sin(t*45+i*2)*.05*k:0}},
pee:(i,n,t)=>{if(tk('p'+i,.07))em(i,pick("'.·"),R(60,110),R(-110,-60),{land:1,max:30,s:.4,c:'#ee8'});return{r:-.05}},
jump:(i,n,t)=>{const k=Math.abs(Math.sin(t*4-i*.45));return{y:-k*fs*1.1,sy:1+.15*k+(k<.1?-.25:0),sx:1-.1*k}},
dance:(i,n,t)=>{const s=Math.sin(t*6+i*.7);if(i==n-1&&tk('d',.6))em(i,pick('♪♫♬'),R(-20,20),-80,{gr:-20,max:1.6,s:.6,c:'#eee'});
  return{x:Math.sin(t*2+i)*fs*.3,y:-Math.abs(s)*fs*.25,r:s*.4}},
run:(i,n,t)=>{const s=Math.sin(t*12+i*.6);if(tk('u'+i,.2))em(i,'.',R(-160,-80),R(-60,-10),{gr:150,max:.6,s:.35,dy:-2});
  return{x:((t*280)%(W+ww+200))-W/2-ww/2-100+W/2-W/2,y:-Math.abs(s)*fs*.3,r:.25+s*.08,sx:1.1,sy:.95}},
walk:(i,n,t)=>{const s=Math.sin(t*5+i*.5);return{x:((t*90)%(W+ww+200))-W/2-ww/2-100,y:-Math.abs(s)*fs*.12,r:s*.1}},
sleep:(i,n,t)=>{const b=Math.sin(t*1.5+i*.3);if(i==0&&tk('z',1.1))em(i,pick('zZz'),R(5,30),-40,{dy:-fs*.8,gr:-5,max:3,s:.5+Math.random()*.5,c:'#9ab'});
  return{y:fs*.12,sy:.8+b*.03,r:.25+Math.sin(t*.7+i)*.04+i*.01}},
sneeze:(i,n,t)=>{const c=t%3,inh=c<1.3,k=Math.min(1,c/1.3),e=inh?0:Math.exp(-(c-1.3)*2),cy=Math.floor(t/3);
  if(!inh&&i==n-1&&TS.sn!==cy){TS.sn=cy;for(let m=0;m<35;m++)em(n-1,pick("'°,."),R(120,420),R(-100,80),{dy:-fs*.5,gr:350,max:1.3,s:.4,c:'#9df'})}
  return inh?{r:-.3*k*(i+1)/n,sy:1+.2*k,y:-k*6}:{x:e*fs*.9*(i+1)/n,r:e*.5,sx:1+e*.3}},
vomit:(i,n,t)=>{const p=Math.sin(t*9);if(i==n-1&&p>-.3&&tk('v',.06))em(n-1,pick(chars.concat(['~','%'])),R(80,200),R(-30,50),{dy:-fs*.3,land:1,max:25,s:.5,c:'#8d5'});
  return{r:.3+.35*(i/n)+p*.04,y:p*3}},
cry:(i,n,t)=>{const s=Math.sin(t*14+i);if(tk('c'+i,.35))em(i,'•',R(-8,8),R(0,20),{dy:-fs*.3,land:1,max:30,s:.4,c:'#6cf'});
  return{y:fs*.08+Math.abs(s)*3,sy:.92,r:Math.sin(t*14+i*2)*.05}},
laugh:(i,n,t)=>{const s=Math.sin(t*18+i*.8);if(i==0&&tk('h',.35))em(pick([0,n-1]),pick(['ha','HA','he','ho']),R(-80,80),R(-140,-80),{dy:-fs*.8,gr:150,max:1.6,s:.6,c:'#eee'});
  return{y:-Math.abs(s)*fs*.12,r:s*.18}},
eat:(i,n,t)=>{const s=Math.abs(Math.sin(t*7-i*.5));if(tk('e'+i,.5))em(i,'.',R(-30,30),R(-20,40),{dy:-fs*.2,land:1,max:20,s:.45,c:'#da6'});return{sy:1-.4*s,sx:1+.2*s}},
fart:(i,n,t)=>{const c=t%2.2,on=c>1;if(on&&i==0&&tk('f',.1))em(0,pick('~°o*'),R(-160,-70),R(-30,20),{dx:-fs*.3,dy:-fs*.2,gr:-30,max:1.6,s:.55,c:'#9b5'});
  return{x:on?Math.sin(t*60+i)*3:0,r:on?-.1*(1-i/n):0}},
kick:(i,n,t)=>{const c=(t*1.2+(n-1-i)*.08)%1,e=c<.3?c/.3:Math.max(0,1-(c-.3)/.5);return{x:e*fs*.6,y:-e*fs*.3,r:e*.6}},
punch:(i,n,t)=>{const c=(t*1.5-i*.12)%1,e=c<.2?c/.2:Math.max(0,1-(c-.2)/.4);if(e>.95&&tk('pp'+i,.6))em(i,'!',200,-20,{gr:0,max:.5,s:.6,dy:-fs*.5});return{x:e*fs*.7,sx:1+e*.4}},
sing:(i,n,t)=>{const s=Math.sin(t*3+i*.5);if(i==n-1&&tk('n',.45))em(i,pick('♪♫♬'),R(30,120),R(-90,-40),{dy:-fs*.8,gr:-30,max:2,s:.7});return{y:-Math.abs(s)*fs*.15,sy:1+s*.08,r:s*.1}},
spin:(i,n,t)=>({sx:Math.cos(t*5+i*.4)}),
explode:(i,n,t)=>{const c=t%3.6,cy=Math.floor(t/3.6),sd=seeds[i]||{a:0,b:0};
  let sc=c>1.6&&c<2?(c-1.6)/.4:c>=2&&c<2.8?1:c>=2.8?1-(c-2.8)/.8:0;sc=Math.max(0,Math.min(1,sc));sc=sc*sc*(3-2*sc);
  if(c>1.6&&i==0&&TS.ex!==cy){TS.ex=cy;for(let m=0;m<40;m++){const a=R(0,6.28),v=R(100,420);em(Math.floor(R(0,n)),pick('*·+'),Math.cos(a)*v,Math.sin(a)*v,{dy:-fs*.4,gr:200,max:1.4,s:.5})}}
  return{x:sd.a*W*.4*sc+(c<1.6?Math.sin(t*50+i)*3*c/1.6:0),y:sd.b*H*.35*sc,r:sd.a*7*sc}},
fly:(i,n,t)=>({x:Math.sin(t+i*.1)*fs,y:-fs*1.5+Math.sin(t*2+i*.5)*fs*.3,r:Math.sin(t*8+i*.5)*.4,sx:.7+.3*Math.abs(Math.sin(t*8+i*.5))}),
melt:(i,n,t)=>{const c=(t%4)/4,k=Math.min(1,c*1.4);if(tk('m'+i,.5))em(i,'.',R(-5,5),R(0,20),{land:1,max:30,s:.4});return{sy:1-.8*k,y:0,sx:1+.5*k}},
shake:(i,n,t)=>({x:Math.sin(t*60+i*3)*5,y:Math.cos(t*55+i)*5,r:Math.sin(t*50+i)*.08}),
wave:(i,n,t)=>({y:Math.sin(t*5-i*.7)*fs*.3,r:Math.cos(t*5-i*.7)*.25}),
sway:(i,n,t)=>({x:Math.sin(t+i*.15)*fs*.5,r:Math.sin(t+i*.15)*.15}),
drift:(i,n,t)=>({x:Math.sin(t*.5+i*.1)*fs*1.2,y:Math.sin(t*.7+i*.3)*fs*.15,r:Math.sin(t*.5+i*.1)*.08}),
shift:(i,n,t)=>({x:Math.tanh(Math.sin(t*1.5+i*.2)*4)*fs*.7}),
tumble:(i,n,t)=>{const k=Math.abs(Math.sin(t*2.5+i*.5));return{x:Math.sin(t*.8)*fs*2,y:-k*fs*.5,r:t*4*(i%2?1:-1)+i}},
talk:(i,n,t)=>{const s=Math.abs(Math.sin(t*9+i*1.3));if(i==0&&tk('tk',.5))em(0,pick(['blah','...','yak','"']),R(60,140),R(-60,-20),{dy:-fs*.7,gr:-10,max:1.4,s:.45});return{y:-s*fs*.06,sy:1+s*.1}},
rant:(i,n,t)=>{const s=Math.abs(Math.sin(t*16+i*1.7));if(tk('rn'+i,.3))em(i,pick(['!','?!','BLAH','#@%']),R(-100,100),R(-140,-50),{dy:-fs*.8,gr:200,max:1,s:.5});return{x:Math.sin(t*30+i)*3,y:-s*fs*.1,sy:1+s*.15,r:Math.sin(t*14+i)*.1}},
point:(i,n,t)=>{const j=Math.max(0,Math.sin(t*4)),l=i==n-1;if(l&&j>.9&&tk('pt',.35))em(i,'→',220,0,{dy:-fs*.4,gr:0,max:.7,s:.6});return{r:.3,x:l?j*fs*.6:0,sx:l?1+j*.5:1}},
slap:(i,n,t)=>{const c=(t*1.4-i*.12)%1,e=c<.15?c/.15:Math.max(0,1-(c-.15)/.3);if(e>.95&&tk('sl'+i,.6))em(i,pick(['SLAP','!','*']),R(60,160),R(-80,-20),{dy:-fs*.6,gr:200,max:.7,s:.5});return{r:-e,x:e*fs*.4}},
throw:(i,n,t)=>{const c=(t*1.1-i*.1)%1.6,k=Math.sin(Math.min(1,c/1.2)*Math.PI);return{y:-k*fs*2.5,x:k*fs*.5,r:k*Math.PI*2*(i%2?1:-1)}},
crawl:(i,n,t)=>{const s=Math.sin(t*4-i*.8);return{x:Math.sin(t*.7)*fs,sx:1+.3*s,sy:1-.2*s,y:fs*.05}},
push:(i,n,t)=>{const s=Math.sin(t*3-i*.4);return{x:s*fs*.5,sx:1+Math.abs(s)*.3,r:s*.1}},
clap:(i,n,t)=>{const p=Math.abs(Math.sin(t*6));if(i==0&&p>.97&&tk('cp',.3))em(0,'!',0,-80,{dy:-fs,gr:0,max:.5,s:.6});return{x:(i%2?-1:1)*p*fs*.25,sx:1-p*.2}},
bow:(i,n,t)=>{const s=Math.max(0,Math.sin(t*2-i*.3));return{r:s*.9,y:s*fs*.1}},
sparkle:(i,n,t)=>{const s=Math.max(0,Math.sin(t*5+i*1.9));if(s>.95&&tk('sp'+i,.4))em(i,pick('✦*+'),R(-20,20),R(-60,-20),{dy:-fs*.8,gr:-20,max:1,s:.6,c:'#ffd'});return{sx:1+s*.25,sy:1+s*.25}},
pulse:(i,n,t)=>{const b=Math.pow(Math.max(0,Math.sin(t*4)),3);return{sx:1+b*.2,sy:1+b*.2}},
write:(i,n,t)=>{const l=i==n-1;if(l&&tk('wr',.15))em(i,pick('_-~.,'),R(-20,20),R(20,60),{dy:-fs*.1,land:1,max:20,s:.4});return{x:l?Math.sin(t*20)*fs*.2:0,y:l?Math.sin(t*35)*fs*.1:0,r:l?-.3:0}},
shoot:(i,n,t)=>{const c=(t*1.5)%1,l=i==n-1&&c<.1;if(l&&tk('sh',.2))em(i,pick('-·'),420,R(-10,10),{dy:-fs*.4,gr:0,max:.7,s:.5,c:'#ffe'});return{x:l?-fs*.3:0,r:l?-.3:0}},
buttsex:(i,n,t)=>{const bt=t*(5+Math.min(t%8,6)*1.2),s=.5+.5*Math.sin(bt+Math.floor(i/2)*.6);
  if(i==0&&t%8>7&&tk('cl',.08))em(Math.floor(R(0,n)),pick('*♥!'),R(-150,150),R(-200,-60),{dy:-fs*.6,gr:300,max:1.2,s:.6,c:'#f6a'});
  if(i%2==0&&i+1>=n){if(tk('q'+i,.8))em(i,pick("'?"),R(-20,20),R(-60,-20),{dy:-fs*.9,gr:200,max:1,s:.4});return{r:Math.sin(t*20)*.1}}
  if(i%2==0){if(tk('h'+i,.5))em(i,pick(['♥','!','oh']),R(-40,40),R(-120,-60),{dy:-fs*.9,gr:-20,max:1.4,s:.5,c:'#f6a'});return{r:-1.1,x:-s*fs*.12,y:fs*.1,sy:.95}}
  return{x:-s*fs*.5,y:-s*2,r:.1}},
fall:(i,n,t)=>{const c=(t*.8+i*.08)%2.4,y=Math.min(gnd-(BP[i]?BP[i].y:gy),Math.max(0,c-.8)**2*H*1.2);return{y,r:y>0?(i%2?1:-1)*Math.min(1.5,y/200):0}},
grow:(i,n,t)=>{const k=.5+.5*Math.sin(t*3-i*.4);return{sx:1+.5*k,sy:1+.5*k}},
freeze:(i,n,t)=>{if(tk('z'+i,.5))em(i,'*',R(-20,20),R(20,60),{dy:-fs*1.6,gr:60,land:1,max:20,s:.4,c:'#cef'});return{x:Math.sin(t*70+i*5)*1.5,sy:.97}},
burn:(i,n,t)=>{if(tk('b'+i,.12))em(i,'^',R(-15,15),R(-140,-60),{dy:-fs*.7,gr:-100,max:.8,s:.45,c:'#f93'});return{r:Math.sin(t*20+i*2)*.05,sy:1+Math.sin(t*25+i)*.04}},
love:(i,n,t)=>{if(tk('l'+i,.7))em(i,'♥',R(-20,20),R(-90,-50),{dy:-fs*.8,gr:-20,max:1.8,s:.5,c:'#f6a'});return{y:-Math.abs(Math.sin(t*3+i*.5))*fs*.12,r:Math.sin(t*2+i)*.1}},
think:(i,n,t)=>{if(i==n-1&&tk('q',.8))em(i,pick('?.'),R(10,40),R(-80,-40),{dy:-fs*.9,gr:-10,max:2,s:.6});return{r:Math.sin(t*1.2)*.15,y:Math.sin(t*1.2+i)*3}},
shout:(i,n,t)=>{const k=Math.max(0,Math.sin(t*5));if(k>.5&&tk('o'+i,.3))em(i,'!',R(-120,120),R(-160,-40),{dy:-fs*.6,gr:100,max:1,s:.55});return{sx:1+k*.3,sy:1+k*.35}},
swim:(i,n,t)=>{if(tk('w'+i,.6))em(i,'o',R(-5,5),R(-70,-30),{dy:-fs*.8,gr:-40,max:1.5,s:.3,c:'#8cf'});return{x:Math.sin(t*2)*fs,y:Math.sin(t*4-i*.8)*fs*.25,r:Math.cos(t*4-i*.8)*.3}},
/* world-effect + text-gag verbs */
rain:(i,n,t)=>{if(tk('rn'+i,.07))em(i,pick("'."),R(-8,8),R(-50,-15),{dy:-fs*1.15,gr:950,land:1,max:45,s:.3,c:'#9cf'});return{y:fs*.03}},
snow:(i,n,t)=>{if(tk('sn'+i,.15))em(i,pick('*·❄'),R(-30,30),R(8,26),{dy:-fs*1.25,gr:14,max:45,s:.35,c:'#def'});return{y:Math.sin(t*1.2+i*.4)*2}},
drip:(i,n,t)=>{if(tk('dp'+i,.55))em(i,'o',0,R(0,10),{dy:-fs*.08,gr:1100,land:1,max:45,s:.32,c:'#7bd'});return{sy:1+Math.sin(t*2+i)*.02}},
storm:(i,n,t)=>{if(tk('tm'+i,.06))em(i,pick("'."),R(-10,10),R(-70,-25),{dy:-fs*1.1,gr:1000,land:1,max:35,s:.3,c:'#9cf'});
  if(tk('lit',1.4))for(let m=0;m<3;m++)em(Math.floor(R(0,n)),'⚡',R(-40,40),R(-50,10),{dy:-fs*1.5,gr:0,max:.35,s:2.2,c:'#fff'});
  return{x:Math.sin(t*60+i*2)*6,y:Math.cos(t*57+i)*4,r:Math.sin(t*50+i)*.06}},
wind:(i,n,t)=>{if(tk('wd'+i,.1))em(i,pick('-·~'),R(-260,-120),R(-30,10),{dy:-fs*.3,gr:0,max:.9,s:.35,c:'#bcd'});
  return{r:-.22+Math.sin(t*4-i*.5)*.06,x:Math.sin(t*3-i*.4)*6}},
flood:(i,n,t)=>{if(tk('fl'+i,.3))em(i,'o',R(-8,8),R(-70,-30),{gr:-50,max:1.6,s:.3,c:'#8cf'});
  return{y:Math.sin(t*1.6-i*.3)*fs*.18,r:Math.sin(t*1.4+i)*.05,sy:1.02}},
quake:(i,n,t)=>{if(tk('qk',.12))em(Math.floor(R(0,n)),pick(".`'"),R(-120,120),R(20,120),{gr:600,land:1,max:30,s:.4,c:'#a98'});
  return{x:Math.sin(t*70+i*4)*11,y:Math.cos(t*63+i*3)*7,r:Math.sin(t*58+i)*.12}},
sink:(i,n,t)=>{const k=(t*.5)%1;if(tk('sk'+i,.4))em(i,'o',R(-6,6),R(-50,-20),{gr:-40,max:1.4,s:.28,c:'#8be'});
  return{y:k*fs*.55,r:Math.sin(t*2+i)*.04,sy:1-.1*k}},
zoom:(i,n,t)=>{const c=(t%2.4)/2.4,k=c<.85?Math.pow(c/.85,3):0,o=Lp[i]||{x:W/2,y:gy};return{x:(o.x-W/2)*k*1.5,y:(o.y-gy)*k*1.5,sx:1+k*7,sy:1+k*7}},
stretch:(i,n,t)=>{const k=Math.sin((t%3)/3*Math.PI);return{x:(i-(n-1)/2)*fs*.35*k,sx:1+k*.25}},
squish:(i,n,t)=>{const k=Math.pow(Math.sin((t%2.2)/2.2*Math.PI),.6);return{sy:1-.85*k,sx:1+.55*k,y:fs*.62*k}},
puff:(i,n,t)=>{const k=Math.sin((t%2.6)/2.6*Math.PI);if(tk('pf'+i,.5))em(i,pick('·o'),R(-20,20),R(-60,-20),{dy:-fs*.6,gr:-30,max:1.2,s:.3,c:'#ccc'});
  return{sx:1+k*.45,sy:1+k*.45,y:-k*fs*.15}},
die:(i,n,t)=>{const k=Math.min(1,((t*.7+i*.12)%3)/1.2),e=k*k*(3-2*k);return{y:e*fs*1.5,r:e*1.45,sy:1-.05*e}},
dig:(i,n,t)=>{const k=Math.min(1,((t*.8+i*.06)%2.6)/1.8);
  if(k>.05&&k<.95&&tk('dg'+i,.12))em(i,pick(".`,'"),R(-90,90),R(-170,-70),{gr:700,land:1,max:30,s:.35,c:'#a87'});

function find(v){

  const c=new Set([v]),m=v.match(/^(.+?)(ings?|ed|es|s|ers?|ment)$/);
  if(m){const b=m[1];c.add(b);c.add(b+'e');c.add(b.replace(/(.)\1$/,'$1'))}
  for(const k of c){const n=AL[k]||k;if(V[n])return V[n]}
  let best='',bn=null;
  for(const w of Object.keys(AL).concat(Object.keys(V)))if(w.length>=4&&w.length>best.length&&(v.startsWith(w)||v.endsWith(w))){best=w;bn=AL[w]||w}

}
